name: Seuranta

on:
  schedule:
    - cron: "17 5 * * *"   # päivittäin 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tarkista lähteet
        run: python scripts/monitor.py
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tallenna snapshotit
        # Päivittäinen commit (_status.json) pitää myös ajastuksen elossa:
        # GitHub pysäyttää ajastetut workflowt, jos repossa ei ole toimintaa 60 päivään.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if ! git diff --cached --quiet; then
            git commit -m "Seuranta $(date -u +%F)"
            git push
          fi
