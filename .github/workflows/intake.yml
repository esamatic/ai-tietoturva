name: Uusi kohde lomakkeesta

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  intake:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      (contains(github.event.issue.labels.*.name, 'uusi-ominaisuus') ||
       contains(github.event.issue.labels.*.name, 'uusi-lisenssi') ||
       contains(github.event.issue.labels.*.name, 'uusi-lahde'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lue lomake
        id: intake
        run: python scripts/intake.py --event "$GITHUB_EVENT_PATH"
      - name: Sovella
        id: apply
        if: contains(fromJSON('["row","column","source"]'), steps.intake.outputs.kind)
        run: python scripts/apply_patch.py --patch-file out/patch.json --ref "#${ISSUE}"
      - name: Avaa pull request ja lähetä tutkimuspaketti
        if: steps.apply.outputs.ok == 'true'
        run: |
          python scripts/validate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="intake/issue-${ISSUE}"
          git switch -c "$branch"
          git add data
          git commit -m "Uusi kohde issuesta #${ISSUE}"
          git push origin "$branch"
          url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
                --title "Uusi kohde: ${ISSUE_TITLE}" --body-file out/pr_body.md)
          gh issue comment "$ISSUE" --body "Pull request avattu: $url"
          if [ -f out/bundle.md ]; then gh issue comment "$ISSUE" --body-file out/bundle.md; fi
      - name: Raportoi virhe
        if: steps.intake.outputs.kind == 'error' || steps.apply.outputs.ok == 'false'
        run: gh issue comment "$ISSUE" --body-file out/error.md
