name: Patch kommentista

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: patch-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  apply:
    # Vain repon omistajan kommentit, vain issueissa (ei PR-kommentit), vain jos patch-lohko löytyy.
    if: >-
      github.event.comment.author_association == 'OWNER' &&
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, 'BEGIN-PATCH')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      COMMENT_ID: ${{ github.event.comment.id }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validoi ja sovella
        id: apply
        # Kommentti luetaan tapahtumatiedostosta datana; sitä ei interpoloida komentoihin.
        run: python scripts/apply_patch.py --event "$GITHUB_EVENT_PATH"
      - name: Avaa pull request
        if: steps.apply.outputs.ok == 'true'
        run: |
          python scripts/validate.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="patch/issue-${ISSUE}-${COMMENT_ID}"
          git switch -c "$branch"
          git add data
          git commit -m "Päivitys issuesta #${ISSUE}"
          git push origin "$branch"
          url=$(gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
                --title "Päivitys: ${ISSUE_TITLE}" --body-file out/pr_body.md)
          gh issue comment "$ISSUE" --body "Pull request avattu: $url"
      - name: Raportoi virhe
        if: steps.apply.outputs.ok != 'true'
        run: gh issue comment "$ISSUE" --body-file out/error.md
