name: Täysi tarkistus

on:
  schedule:
    - cron: "0 6 1 1,4,7,10 *"   # neljännesvuosittain
  workflow_dispatch:
    inputs:
      vendor:
        description: "Tarjoajan tunniste (esim. ms, go, an, oa) tai all"
        type: string
        default: all

permissions:
  contents: read
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/research.py --vendor "${VENDOR}"
        env:
          GH_TOKEN: ${{ github.token }}
          VENDOR: ${{ inputs.vendor || 'all' }}
